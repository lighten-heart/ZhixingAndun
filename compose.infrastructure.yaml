name: aegisguard-infrastructure
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    env_file: postgres.env
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-evidence:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisguard -d aegisguard"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
volumes:
  postgres-evidence:
